name: Android debug APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketdex-manual-debug
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build debug APK and run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Upload debug APK for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocketdex-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: error
